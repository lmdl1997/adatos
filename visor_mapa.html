<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor de GeoJSON Venezuela</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-color: #0f172a;
            --sidebar-bg: rgba(30, 41, 59, 0.7);
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
        }

        #container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        #sidebar {
            width: 350px;
            background: var(--sidebar-bg);
            backdrop-filter: blur(12px);
            border-right: 1px solid var(--glass-border);
            padding: 2rem;
            display: flex;
            flex-direction: column;
            z-index: 1000;
            box-shadow: 10px 0 30px rgba(0,0,0,0.5);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .instruction {
            font-size: 0.9rem;
            line-height: 1.6;
            color: #94a3b8;
            margin-bottom: 2rem;
        }

        .file-input-wrapper {
            position: relative;
            margin-bottom: 1.5rem;
        }

        input[type="file"] {
            display: none;
        }

        .custom-file-upload {
            display: block;
            padding: 1rem;
            background: rgba(56, 189, 248, 0.1);
            border: 1px dashed var(--accent-color);
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            color: var(--accent-color);
            font-weight: 600;
        }

        .custom-file-upload:hover {
            background: rgba(56, 189, 248, 0.2);
            transform: translateY(-2px);
        }

        #map {
            flex-grow: 1;
            height: 100%;
            background: #0b0f1a;
        }

        .info-card {
            padding: 1rem;
            background: rgba(15, 23, 42, 0.9);
            border-radius: 8px;
            border: 1px solid var(--glass-border);
            color: white;
            font-size: 0.85rem;
        }

        /* Leaflet Dark Theme Overrides */
        .leaflet-container {
            background: #0b0f1a !important;
        }
    </style>
</head>
<body>

<div id="container">
    <div id="sidebar">
        <h1>Venezuela GeoJSON Viewer</h1>
        <p class="instruction">
            Arrastra o selecciona cualquiera de los archivos <code>.geojson</code> generados para visualizarlos interactivamente en el mapa.
        </p>
        
        <div class="file-input-wrapper">
            <label for="file-selector" class="custom-file-upload">
                Seleccionar Archivo GeoJSON
            </label>
            <input type="file" id="file-selector" accept=".geojson">
        </div>

        <div id="details" style="margin-top: auto;">
            <p style="font-size: 0.8rem; color: #64748b;">
                Tip: Puedes cargar los archivos de las carpetas <code>estados/</code> o <code>municipios/</code> para ver el detalle administrativo.
            </p>
        </div>
    </div>
    <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const map = L.map('map', {
        zoomControl: false,
        attributionControl: false
    }).setView([7.0, -66.0], 6);

    // Dark layer
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        maxZoom: 19
    }).addTo(map);

    let geojsonLayer;

    document.getElementById('file-selector').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(event) {
            const data = JSON.parse(event.target.result);
            
            if (geojsonLayer) map.removeLayer(geojsonLayer);

            geojsonLayer = L.geoJSON(data, {
                style: function(feature) {
                    return {
                        fillColor: '#38bdf8',
                        weight: 1.5,
                        opacity: 1,
                        color: 'white',
                        fillOpacity: 0.2
                    };
                },
                onEachFeature: function(feature, layer) {
                    let popupContent = '<div class="info-card">';
                    if (feature.properties) {
                        for (let key in feature.properties) {
                            if (feature.properties[key]) {
                                popupContent += `<strong>${key}:</strong> ${feature.properties[key]}<br>`;
                            }
                        }
                    }
                    popupContent += '</div>';
                    layer.bindPopup(popupContent);
                    
                    layer.on('mouseover', function() {
                        this.setStyle({ fillOpacity: 0.5, weight: 2.5, color: '#38bdf8' });
                    });
                    layer.on('mouseout', function() {
                        this.setStyle({ fillOpacity: 0.2, weight: 1.5, color: 'white' });
                    });
                }
            }).addTo(map);

            map.fitBounds(geojsonLayer.getBounds());
        };
        reader.readAsText(file);
    });
</script>
</body>
</html>
